[project]
name = "job-radar"
version = "3.1.0"
description = "Daily job-discovery agent: fetch public ATS boards, filter deterministically, score with Claude, file a GitHub issue."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
