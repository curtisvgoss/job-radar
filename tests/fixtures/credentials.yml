- id: anthropic-api-key
  label: "Anthropic API key 'example'"
  used_by: "radar.yml, repo secret ANTHROPIC_API_KEY"
  console: "Console -> Settings -> API keys"
  expires: 2030-06-15
  rotate: "1) Create a new key. 2) gh secret set ANTHROPIC_API_KEY -R {repo}. 3) Update expires. 4) Delete the old key."
- id: example-token
  label: "GitHub token 'example'"
  used_by: "local gh CLI"
  console: "github.com/settings/personal-access-tokens"
  expires: 2030-06-14
  rotate: "1) Regenerate the token. 2) Update expires."
